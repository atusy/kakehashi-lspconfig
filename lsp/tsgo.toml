# WARN: cmd hardcoded to the global `tsgo`; source preferred node_modules/.bin/tsgo when present
# WARN: root_dir was a dynamic Lua function (dynamic root detection); approximate with `rootMarkers` if the default (client root) is wrong
[languageServers.tsgo]
enabled = false
cmd = ["tsgo", "--lsp", "--stdio"]
languages = ["javascript", "javascriptreact", "typescript", "typescriptreact"]
settings = { typescript = { inlayHints = { enumMemberValues = { enabled = true }, functionLikeReturnTypes = { enabled = true }, parameterNames = { enabled = "literals", suppressWhenArgumentMatchesName = true }, parameterTypes = { enabled = true }, propertyDeclarationTypes = { enabled = true }, variableTypes = { enabled = true } } } }
