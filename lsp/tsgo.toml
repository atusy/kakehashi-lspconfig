# WARN: cmd hardcoded to the global `tsgo`; source preferred node_modules/.bin/tsgo when present
# WARN: root_dir was a dynamic Lua function (dynamic root detection); approximate with `workspaceMarkers` if the default (client root) is wrong
# WARN: on_init (editor-side hook) was dropped; not applicable to kakehashi
[languageServers.tsgo]
enabled = false
cmd = ["tsgo", "--lsp", "--stdio"]
languages = ["javascript", "javascriptreact", "typescript", "typescriptreact"]
settings = { "js/ts" = { implementationsCodeLens = { enabled = true, showOnAllClassMethods = true, showOnInterfaceMethods = true }, inlayHints = { enumMemberValues = { enabled = true }, functionLikeReturnTypes = { enabled = true }, parameterNames = { enabled = "literals", suppressWhenArgumentMatchesName = true }, parameterTypes = { enabled = true }, propertyDeclarationTypes = { enabled = true }, variableTypes = { enabled = true } }, referencesCodeLens = { enabled = true, showOnAllFunctions = true } } }
