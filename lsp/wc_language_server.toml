[languageServers.wc_language_server]
cmd = ["wc-language-server", "--stdio"]
languages = ["html", "javascriptreact", "typescriptreact", "astro", "svelte", "vue", "markdown", "mdx", "javascript", "typescript", "css", "scss", "less"]
rootMarkers = ["wc.config.js", "wc.config.ts", "wc.config.mjs", "wc.config.cjs", "custom-elements.json", "package.json", ".git"]
initializationOptions = { hostInfo = "neovim" }
