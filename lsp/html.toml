# WARN: cmd hardcoded to the global `vscode-html-language-server`; source preferred node_modules/.bin when present
[languageServers.html]
enabled = false
cmd = ["vscode-html-language-server", "--stdio"]
languages = ["html"]
workspaceMarkers = ["package.json", ".git"]
initializationOptions = { configurationSection = ["html", "css", "javascript"], embeddedLanguages = { css = true, javascript = true }, provideFormatter = true }
