# WARN: on_attach (editor-side hook) was dropped; not applicable to kakehashi
# WARN: on_init (editor-side hook) was dropped; not applicable to kakehashi
[languageServers.gitlab_duo]
enabled = false
cmd = ["npx", "--@gitlab-org:registry=https://gitlab.com/api/v4/packages/npm/", "@gitlab-org/gitlab-lsp", "--stdio"]
languages = ["ruby", "go", "javascript", "typescript", "typescriptreact", "javascriptreact", "rust", "lua", "python", "java", "cpp", "c", "php", "cs", "kotlin", "swift", "scala", "vue", "svelte", "html", "css", "scss", "json", "yaml"]
workspaceMarkers = [".git"]
initializationOptions = { editorInfo = { name = "Neovim", version = "0.13.0-dev" }, editorPluginInfo = { name = "Neovim LSP", version = "0.13.0-dev" }, extension = { name = "Neovim LSP Client", version = "0.13.0-dev" }, ide = { name = "Neovim", vendor = "Neovim", version = "0.13.0-dev" } }
settings = { baseUrl = "https://gitlab.com", codeCompletion = { enableSecretRedaction = true }, featureFlags = { streamCodeGenerations = false }, logLevel = "info", telemetry = { enabled = false } }
