# WARN: cmd hardcoded to the global `glint-language-server`; source preferred node_modules/.bin when init_options.glint.useGlobal is false (the default)
# WARN: workspace_required was dropped; not applicable to kakehashi
[languageServers.glint]
enabled = false
cmd = ["glint-language-server"]
languages = ["html.handlebars", "handlebars", "typescript", "typescript.glimmer", "javascript", "javascript.glimmer"]
rootMarkers = [".glintrc.yml", ".glintrc", ".glintrc.json", ".glintrc.js", "glint.config.js", "package.json"]
initializationOptions = { glint = { useGlobal = false } }
