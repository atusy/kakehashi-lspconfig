# WARN: cmd hardcoded to `jdtls` (assumes a launcher script, e.g. jdtls-launcher, on PATH); source computed a per-project -data workspace dir and JDTLS_JVM_ARGS, which are lost
[languageServers.jdtls]
enabled = false
cmd = ["jdtls"]
languages = ["java"]
rootMarkers = [["mvnw", "gradlew", "settings.gradle", "settings.gradle.kts", ".git"], ["build.xml", "pom.xml", "build.gradle", "build.gradle.kts"]]
