# WARN: on_attach (editor-side hook) was dropped; not applicable to kakehashi
[languageServers.pyright]
enabled = false
cmd = ["pyright-langserver", "--stdio"]
languages = ["python"]
workspaceMarkers = ["pyrightconfig.json", "pyproject.toml", "setup.py", "setup.cfg", "requirements.txt", "Pipfile", ".git"]
settings = { pyright = { disableTaggedHints = true }, python = { analysis = { autoSearchPaths = true, diagnosticMode = "openFilesOnly", useLibraryCodeForTypes = true } } }
