[languageServers.csharp_ls]
enabled = false
cmd = ["csharp-ls"]
languages = ["cs"]
workspaceMarkers = ["*.sln", "*.slnx", "*.csproj"]
initializationOptions = { AutomaticWorkspaceInit = true }
