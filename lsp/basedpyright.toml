# WARN: on_attach (editor-side hook) was dropped; not applicable to kakehashi
[languageServers.basedpyright]
enabled = false
cmd = ["basedpyright-langserver", "--stdio"]
languages = ["python"]
workspaceMarkers = ["pyrightconfig.json", "pyproject.toml", "setup.py", "setup.cfg", "requirements.txt", "Pipfile", ".git"]
settings = { basedpyright = { analysis = { autoSearchPaths = true, diagnosticMode = "openFilesOnly" }, disableTaggedHints = true } }
