# WARN: on_attach (editor-side hook) was dropped; not applicable to kakehashi
[languageServers.basedpyright]
cmd = ["basedpyright-langserver", "--stdio"]
languages = ["python"]
rootMarkers = ["pyrightconfig.json", "pyproject.toml", "setup.py", "setup.cfg", "requirements.txt", "Pipfile", ".git"]
settings = { basedpyright = { analysis = { autoSearchPaths = true, diagnosticMode = "openFilesOnly" } } }
