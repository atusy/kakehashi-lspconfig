[languageServers.dartls]
enabled = false
cmd = ["dart", "language-server", "--protocol=lsp"]
languages = ["dart"]
workspaceMarkers = ["pubspec.yaml"]
initializationOptions = { closingLabels = true, flutterOutline = true, onlyAnalyzeProjectsWithOpenFiles = true, outline = true, suggestFromUnimportedLibraries = true }
settings = { dart = { completeFunctionCalls = true, showTodos = true } }
