[languageServers.ansiblels]
enabled = false
cmd = ["ansible-language-server", "--stdio"]
languages = ["yaml.ansible"]
rootMarkers = ["ansible.cfg", ".ansible-lint"]
settings = { ansible = { ansible = { path = "ansible" }, executionEnvironment = { enabled = false }, python = { interpreterPath = "python" }, validation = { enabled = true, lint = { enabled = true, path = "ansible-lint" } } } }
