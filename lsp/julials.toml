# WARN: on_attach (editor-side hook) was dropped; not applicable to kakehashi
[languageServers.julials]
enabled = false
cmd = ["julia", "--startup-file=no", "--history-file=no", "-e", "    # Load LanguageServer.jl: attempt to load from ~/.julia/environments/nvim-lspconfig\n    # with the regular load path as a fallback\n    ls_install_path = joinpath(\n        get(DEPOT_PATH, 1, joinpath(homedir(), \".julia\")),\n        \"environments\", \"nvim-lspconfig\"\n    )\n    pushfirst!(LOAD_PATH, ls_install_path)\n    using LanguageServer\n    popfirst!(LOAD_PATH)\n    @info \"Running language server\" VERSION pwd()\n    LanguageServer.runserver()\n  "]
languages = ["julia"]
workspaceMarkers = ["Project.toml", "JuliaProject.toml"]
