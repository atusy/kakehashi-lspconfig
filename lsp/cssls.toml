# WARN: cmd hardcoded to the global `vscode-css-language-server`; source preferred node_modules/.bin when present
[languageServers.cssls]
enabled = false
cmd = ["vscode-css-language-server", "--stdio"]
languages = ["css", "scss", "less"]
workspaceMarkers = ["package.json", ".git"]
initializationOptions = { provideFormatter = true }
settings = { css = { validate = true }, less = { validate = true }, scss = { validate = true } }
