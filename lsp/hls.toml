[languageServers.hls]
enabled = false
cmd = ["haskell-language-server-wrapper", "--lsp"]
languages = ["haskell", "lhaskell"]
workspaceMarkers = ["hie.yaml", "stack.yaml", "cabal.project", "*.cabal", "package.yaml"]
settings = { haskell = { cabalFormattingProvider = "cabal-fmt", formattingProvider = "ormolu" } }
