# WARN: workspaceMarkers dropped 1 glob-style marker(s) (*.cabal); kakehashi matches marker names exactly and does not glob-expand
[languageServers.hls]
enabled = false
cmd = ["haskell-language-server-wrapper", "--lsp"]
languages = ["haskell", "lhaskell"]
