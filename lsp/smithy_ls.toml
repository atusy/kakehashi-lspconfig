[languageServers.smithy_ls]
enabled = false
cmd = ["cs", "launch", "--contrib", "smithy-language-server:0.8.0"]
languages = ["smithy"]
workspaceMarkers = ["smithy-build.json", "build.gradle", "build.gradle.kts", ".git"]
initializationOptions = { compilerOptions = { snippetAutoIndent = false }, isHttpEnabled = true, statusBarProvider = "show-message" }
