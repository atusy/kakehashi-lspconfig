# WARN: cmd hardcoded to the global `svelteserver`; source preferred node_modules/.bin/svelteserver when present
# WARN: on_attach (editor-side hook) was dropped; not applicable to kakehashi
[languageServers.svelte]
enabled = false
cmd = ["svelteserver", "--stdio"]
languages = ["svelte"]
workspaceMarkers = [["package-lock.json", "yarn.lock", "pnpm-lock.yaml", "bun.lockb", "bun.lock", "deno.lock"], ".git"]
settings = { typescript = { inlayHints = { enumMemberValues = { enabled = true }, functionLikeReturnTypes = { enabled = true }, parameterNames = { enabled = "literals", suppressWhenArgumentMatchesName = true }, parameterTypes = { enabled = true }, propertyDeclarationTypes = { enabled = true }, variableTypes = { enabled = true } } } }
